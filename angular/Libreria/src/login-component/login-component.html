<section>
  <!-- Login form per prendere il token Jwt -->
   <!-- RICORDA: IMPORTARE REACTIVEFORMSMODULE NELLE IMPORTS DEL COMPONENT, PER POTER PRENDERE formGroup. -->
   <h1>Login</h1>
   <form [formGroup]="profileForm" (submit)="login()">

      <label for="email">Email</label>
      <input type="text" formControlName="email">

      <label for="password">Password</label>
      <input type="password"formControlName="password">

      <button type="submit">Invio</button>
      <button (click)="loginService.logout()" type="button">Logout</button>
      @if (loginService.jwt()!= null) {
        <p>Credenziali corrette!</p>
      }
   </form>
</section>
