<section>
  <!-- Login form per prendere il token Jwt -->
  <!-- RICORDA: IMPORTARE REACTIVEFORMSMODULE NELLE IMPORTS DEL COMPONENT, PER POTER PRENDERE formGroup. -->
  <form [formGroup]="libroForm" (submit)="aggiungiLibro()">
    <h1>Inserimento Libro</h1>
    <label for="isbn">Isbn</label>
    <input type="number" formControlName="isbn" required />

    <label for="titolo">Titolo</label>
    <input type="text" formControlName="titolo" required />

    <label for="anno">Anno</label>
    <input type="date" formControlName="anno" required />

    <label for="genere">Genere</label>
    <input type="text" formControlName="genere" required />

    <label for="prezzo">Prezzo</label>
    <input type="number" formControlName="prezzo" required />

    <label for="autori">Autori</label>
    <!-- La select è il SINGOLO menu a tendina. -->
    <select formControlName="autore" (change)="aggiungiAutore()">
      <option [ngValue]="null" disabled>Seleziona un autore</option>
      @for (autore of autoriFiltrata(); track autore.idAutore) {
        <!-- Per ogni autore, inserisco l'opzione ALL'INTERNO DELLA SELECT -->
        <option [ngValue]="autore">{{ autore.nome }} {{ autore.cognome }}</option>
      }
    </select>
    <!-- Bottone per l'eventuale aggiunta autore se non presente. -->
    <div class="aggiungi-autore">
      <img src="https://www.svgrepo.com/download/246563/add-user-add.svg" alt="Aggiungi autore" />
      <button type="button" [routerLink]="['/autori/addLibri']">Aggiungi autore</button>
    </div>
    @if (autoriSelezionati.length > 0) {
      <div class="autori-selezionati">
        <!-- Mostro gli autori selezionati  -->
        @for (autore of autoriSelezionati; track $index) {
          <span class="autore-chip"> {{ autore.nome }} {{ autore.cognome }} </span>
          <!-- Il for mi tiene traccia dell'autore quindi ogni bottone si ricorda a quale autore è associato -->
          <button type="button" class="rimuovi" (click)="rimuoviAutore(autore)">X</button>
        }
      </div>
    }

    <button type="submit">Invio</button>
  </form>
</section>
