<section>
  <form [formGroup]="libroForm" (submit)="aggiungiLibro()">
    <h1>Modifica Libro</h1>

    <label for="isbn">ISBN</label>
    <input type="number" formControlName="isbn" required />

    <label for="titolo">Titolo</label>
    <input type="text" formControlName="titolo" required />

    <label for="anno">Anno</label>
    <input type="date" formControlName="anno" required />

    <label for="genere">Genere</label>
    <input type="text" formControlName="genere" required />

    <label for="prezzo">Prezzo</label>
    <input type="number" formControlName="prezzo" required />

    <label for="autori">Autori</label>

    <select formControlName="autore" (change)="aggiungiAutore()">
      <option [ngValue]="null">Seleziona un autore</option>

      @for (autore of autoriFiltrata(); track autore.idAutore) {
        <option [ngValue]="autore">
          {{ autore.nome }} {{ autore.cognome }}
        </option>
      }
    </select>

    @if (autoriSelezionati.length > 0) {
      <div class="autori-selezionati">
        @for (autore of autoriSelezionati; track autore.idAutore) {
          <span class="autore-chip">
            {{ autore.nome }} {{ autore.cognome }}
          </span>

          <button
            type="button"
            class="rimuovi"
            (click)="rimuoviAutore(autore)">
            X
          </button>
        }
      </div>
    }

    <button type="submit">Salva modifiche</button>
  </form>
</section>
